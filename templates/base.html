<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DropVault</title>

  <link rel="stylesheet" href="/static/css/style.css">

  <!-- ================= CHATBOT STYLES ================= -->
  <style>
    .chatbot-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 22px;
      cursor: pointer;
      z-index: 9999;
    }

    .chatbot-box {
      position: fixed;
      bottom: 90px;
      right: 24px;
      width: 320px;
      height: 420px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      z-index: 9999;
    }

    .chatbot-header {
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      font-weight: bold;
      border-radius: 12px 12px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chatbot-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 14px;
    }

    .chatbot-message {
      margin-bottom: 10px;
    }

    .chatbot-message.bot {
      color: #111827;
    }

    .chatbot-message.user {
      text-align: right;
      color: #4f46e5;
      font-weight: 500;
    }

    .chatbot-input {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    .chatbot-input input {
      flex: 1;
      border: none;
      padding: 10px;
      outline: none;
    }

    .chatbot-input button {
      border: none;
      background: #4f46e5;
      color: #fff;
      padding: 0 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">
    <h2>DropVault</h2>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/upload">Upload</a>
      <a href="/myfiles">My Files</a>
      <a href="/shared">Shared Files</a>
      <a href="/trash">Trash</a>
      <a href="/settings">Settings</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>

  <!-- ================= CHATBOT ================= -->

  <!-- Toggle Button -->
  <button class="chatbot-toggle" id="chatbotToggle">💬</button>

  <!-- Chat Window -->
  <div class="chatbot-box" id="chatbotBox">
    <div class="chatbot-header">
      DropVault Assistant
      <span id="closeChatbot" style="cursor:pointer">✖</span>
    </div>

    <div class="chatbot-messages" id="chatMessages">
      <div class="chatbot-message bot">
        👋 Hi! I’m your DropVault assistant. Ask me about login, upload, storage, or security.
      </div>
    </div>

    <div class="chatbot-input">
      <input type="text" id="chatInput" placeholder="Type a question..." />
      <button id="sendChat">Send</button>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->

  <script src="/static/js/main.js"></script>

  <script type="module">
    export const API_BASE = "https://dropvault-backend.onrender.com";

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("authToken");
      window.location.href = "/login";
    });
  </script>

  <!-- ================= CHATBOT LOGIC ================= -->
  <script>
    const toggleBtn = document.getElementById("chatbotToggle");
    const chatbotBox = document.getElementById("chatbotBox");
    const closeBtn = document.getElementById("closeChatbot");
    const sendBtn = document.getElementById("sendChat");
    const chatInput = document.getElementById("chatInput");
    const chatMessages = document.getElementById("chatMessages");

    toggleBtn.onclick = () => {
      chatbotBox.style.display =
        chatbotBox.style.display === "flex" ? "none" : "flex";
    };

    closeBtn.onclick = () => chatbotBox.style.display = "none";

    sendBtn.onclick = sendMessage;
    chatInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    /* ================= STANDARD FAQ ================= */

    const FAQS = [
      { k: ["create", "register", "sign up"], a: "📝 Click **Sign Up**, enter your email, verify it, and you’re ready." },
      { k: ["login", "sign in"], a: "🔑 Login using email & password or **Continue with Google**." },
      { k: ["google"], a: "✅ DropVault supports secure Google Login." },
      { k: ["forgot", "reset password"], a: "🔐 Use **Forgot Password** on the login page." },
      { k: ["upload"], a: "⬆️ Go to **Upload** from the sidebar to add files." },
      { k: ["storage", "space"], a: "💾 View your storage usage on the **Dashboard**." },
      { k: ["files"], a: "📁 All your uploaded files are available under **My Files**." },
      { k: ["share"], a: "🔗 Share files securely from **My Files**." },
      { k: ["trash", "delete"], a: "🗑 Deleted files go to **Trash** and can be restored." },
      { k: ["restore"], a: "♻️ Restore deleted files from **Trash**." },
      { k: ["secure", "security"], a: "🔒 DropVault keeps your data protected and encrypted." },
      { k: ["2fa"], a: "🛡️ 2FA adds an extra layer of account security." },
      { k: ["settings", "profile"], a: "⚙️ Update profile, password & preferences in **Settings**." }
    ];

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      chatInput.value = "";

      setTimeout(() => {
        addMessage(getBotReply(text), "bot");
      }, 500);
    }

    function getBotReply(msg) {
      const q = msg.toLowerCase();
      for (const f of FAQS) {
        if (f.k.some(k => q.includes(k))) return f.a;
      }
      return "🤖 I can help with login, upload, storage, sharing, security, and settings.";
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = `chatbot-message ${type}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>

</body>
</html>
