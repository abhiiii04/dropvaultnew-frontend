<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - DropVault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ✅ CRITICAL: Fix COOP errors blocking Google popup communication -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <link rel="stylesheet" href="/static/css/style.css">
  <!-- ✅ FIXED: Removed ALL trailing spaces in URL -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth">
  <div class="auth-container">
    <h2>Login to DropVault</h2>

    <!-- EMAIL LOGIN -->
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="auth-divider">or</div>

    <!-- ✅ GOOGLE LOGIN: AUTHORIZATION CODE FLOW (REQUIRED BY BACKEND) -->
    <div id="g_id_onload"
      data-client_id="100074614026-u5lmua7rt5jajqe9m0nkdfus01c1nkg6.apps.googleusercontent.com"
      data-callback="handleGoogleLogin"
      data-auto_prompt="false"
      data-type="code"          <!-- CRITICAL: Request auth CODE not ID token -->
      data-ux_mode="popup"      <!-- Ensures popup flow -->
      data-itp_support="true">  <!-- Improves Safari compatibility -->
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="continue_with"
      data-shape="pill"
      data-logo_alignment="left">
    </div>

    <p>Don’t have an account? <a href="/register">Sign up</a></p>
  </div>

<script>
// ✅ FIXED: Removed ALL trailing spaces + added URL validation
const API_BASE = "https://dropvault-backend.onrender.com".trim();

/* ============================
   EMAIL / PASSWORD LOGIN
============================ */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please fill in all fields");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/login/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
      credentials: "include"
    });

    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem("token", data.token);
      window.location.href = "/dashboard";
      return;
    }
    alert(data.message || "Login failed. Check credentials.");
  } catch (err) {
    console.error("Email login error:", err);
    alert("Network error. Please try again later.");
  }
});

/* ============================
   GOOGLE LOGIN: AUTH CODE FLOW (FIXES 400 ERROR)
============================ */
function handleGoogleLogin(response) {
  // ✅ Handle Google errors FIRST (user cancellation, network issues)
  if (response.error) {
    console.error("Google auth error:", response.error, response);
    const errorMsg = 
      response.error === 'popup_closed' ? "Popup closed. Please try again." :
      response.error === 'access_denied' ? "Access denied. Please authorize DropVault." :
      "Google authentication failed. Please try again.";
    alert(errorMsg);
    return;
  }

  // ✅ CRITICAL: Backend requires 'code' (authorization code), NOT ID token
  if (!response.code) {
    console.error("Missing authorization code:", response);
    alert("Invalid Google response. Please try again.");
    return;
  }

  // Send auth code to backend for secure token exchange
  fetch(`${API_BASE}/api/auth/google/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: response.code }), // ✅ Correct field name
    credentials: "include"
  })
  .then(async res => {
    const contentType = res.headers.get("content-type");
    const rawData = await res.text();
    
    // Handle non-JSON responses gracefully
    let data;
    try {
      data = contentType?.includes("application/json") ? JSON.parse(rawData) : { error: rawData };
    } catch {
      data = { error: "Invalid server response" };
    }

    if (!res.ok) {
      throw new Error(data.message || data.error || `HTTP ${res.status}`);
    }
    
    if (!data.token) {
      throw new Error("No authentication token received");
    }
    
    localStorage.setItem("token", data.token);
    window.location.href = "/dashboard";
  })
  .catch(err => {
    console.error("Google login failed:", err);
    alert(`Google login failed: ${err.message}`);
  });
}
</script>
</body>
</html>
