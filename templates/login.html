<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - DropVault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!-- FIXED: Removed trailing space in src -->
  <!-- REPLACE THE EXISTING GOOGLE SCRIPT TAG -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth">
  <div class="auth-container">
    <h2>Login to DropVault</h2>

    <!-- EMAIL LOGIN -->
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="auth-divider">or</div>

    <!-- GOOGLE LOGIN BUTTON -->
    <button id="googleBtn" type="button" class="google-btn">
      Continue with Google
    </button>

    <p>Don’t have an account? <a href="/register">Sign up</a></p>
  </div>

<script>
// FIXED: Removed ALL trailing spaces
const API_BASE = "https://dropvault-backend.onrender.com";

// ✅ CRITICAL FIX: Wrap ALL logic in DOMContentLoaded to avoid top-level returns
document.addEventListener('DOMContentLoaded', () => {
  // HANDLE GOOGLE CALLBACK (ONLY ON /google-callback ROUTE)
  if (window.location.pathname === '/google-callback') {
    handleGoogleCallback();
    return; // Safe inside DOMContentLoaded handler
  }

  // NORMAL LOGIN PAGE LOGIC (email form + Google button)
  initLoginPage();
});

// CALLBACK HANDLER (runs ONLY on /google-callback)
async function handleGoogleCallback() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const authCode = urlParams.get('code');
    const error = urlParams.get('error');

    if (error) {
      console.error('Google OAuth error:', error);
      alert(`Google login failed: ${error}`);
      window.history.replaceState({}, document.title, '/login');
      window.location.href = '/login';
      return;
    }

    if (!authCode) {
      throw new Error('No authorization code received');
    }

    console.log("✅ Sending auth code to backend...");
    const res = await fetch(`${API_BASE}/api/auth/google/`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ code: authCode }),
      credentials: 'include'
    });

    const data = await res.json();
    console.log("📡 Backend response:", res.status, data);

    if (!res.ok) {
      const errorMsg = data.message || data.error || `Login failed (${res.status})`;
      throw new Error(errorMsg);
    }

    if (data.token) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('authToken', data.token);
      window.history.replaceState({}, document.title, '/');
      window.location.href = '/dashboard';
    } else {
      throw new Error("No token received from backend");
    }
  } catch (err) {
    console.error('💥 Callback error:', err);
    alert(`Login failed: ${err.message}`);
    window.history.replaceState({}, document.title, '/login');
    window.location.href = '/login';
  }
}

// NORMAL LOGIN PAGE INITIALIZATION
function initLoginPage() {
  // GOOGLE BUTTON: Redirect flow (MATCHES BACKEND)
  document.getElementById("googleBtn")?.addEventListener("click", () => {
    const currentOrigin = window.location.origin;
    let redirectUri;
    
    if (currentOrigin.includes('localhost') || currentOrigin.includes('127.0.0.1')) {
      redirectUri = 'http://localhost:3000/google-callback';
    } else if (currentOrigin.includes('dropvaultnew-frontend.onrender.com')) {
      redirectUri = 'https://dropvaultnew-frontend.onrender.com/google-callback'; // NO TRAILING SPACES
    } else {
      redirectUri = `${currentOrigin}/google-callback`;
    }

    const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` + 
      `client_id=100074614026-u5lmua7rt5jajqe9m0nkdfus01c1nkg6.apps.googleusercontent.com&` +
      `redirect_uri=${encodeURIComponent(redirectUri)}&` +
      `response_type=code&` +
      `scope=email%20profile%20openid&` +
      `access_type=offline&` +
      `prompt=consent`;
    
    window.location.href = googleAuthUrl;
  });

  // EMAIL LOGIN FORM
  document.getElementById("loginForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch(`${API_BASE}/api/login/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
        credentials: "include"
      });
      
      const data = await res.json();
      
      if (res.ok && data.token) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("authToken", data.token);
        window.location.href = "/dashboard";
      } else {
        alert(data.message || "Invalid email or password");
      }
    } catch (err) { 
      console.error("Email login error:", err);
      alert("Network error. Please check your connection.");
    }
  });
}
</script>
</body>
</html>
