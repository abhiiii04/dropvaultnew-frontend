<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - DropVault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!-- FIXED: Removed trailing space in src -->
  <!-- REPLACE THE EXISTING GOOGLE SCRIPT TAG -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth">
  <div class="auth-container">
    <h2>Login to DropVault</h2>

    <!-- EMAIL LOGIN -->
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="auth-divider">or</div>

    <!-- GOOGLE LOGIN BUTTON -->
    <button id="googleBtn" type="button" class="google-btn">
      Continue with Google
    </button>

    <p>Don’t have an account? <a href="/register">Sign up</a></p>
  </div>

<script>
// FIXED: Removed trailing spaces
// REPLACE THE ENTIRE GOOGLE INITIALIZATION AND HANDLER SECTION
const API_BASE = "https://dropvault-backend.onrender.com"; // FIXED: Removed trailing spaces

/* 1. GOOGLE LOGIN - REDIRECT FLOW (MATCHES BACKEND EXPECTATIONS) */
document.getElementById("googleBtn").addEventListener("click", () => {
  // Determine redirect_uri EXACTLY as backend expects (mimic backend logic)
  const currentOrigin = window.location.origin;
  let redirectUri;
  
  if (currentOrigin.includes('localhost') || currentOrigin.includes('127.0.0.1')) {
    redirectUri = 'http://localhost:3000/google-callback';
  } else if (currentOrigin.includes('dropvaultnew-frontend.onrender.com')) {
    redirectUri = 'https://dropvaultnew-frontend.onrender.com/google-callback'; // NO TRAILING SPACES
  } else {
    redirectUri = `${currentOrigin}/google-callback`;
  }

  // Construct Google OAuth URL (redirect flow - NOT popup)
  const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` + 
    `client_id=100074614026-u5lmua7rt5jajqe9m0nkdfus01c1nkg6.apps.googleusercontent.com&` +
    `redirect_uri=${encodeURIComponent(redirectUri)}&` +
    `response_type=code&` +
    `scope=email%20profile%20openid&` +
    `access_type=offline&` +
    `prompt=consent`;

  // Redirect user to Google (backend expects this flow)
  window.location.href = googleAuthUrl;
});

/* 2. HANDLE GOOGLE CALLBACK (ADD THIS NEW SECTION) */
// ONLY executes when Google redirects back to /google-callback
if (window.location.pathname === '/google-callback') {
  const urlParams = new URLSearchParams(window.location.search);
  const authCode = urlParams.get('code');
  const error = urlParams.get('error');

  if (error) {
    console.error('Google OAuth error:', error);
    alert(`Google login failed: ${error}`);
    window.history.replaceState({}, document.title, '/login'); // Clean URL
    window.location.href = '/login';
    return;
  }

  if (authCode) {
    // Send code to backend EXACTLY as expected
    fetch(`${API_BASE}/api/auth/google/`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ code: authCode }), // Backend expects "code" key
      credentials: 'include'
    })
    .then(response => response.json())
    .then(data => {
      if (data.token) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('authToken', data.token);
        // Clean URL before redirect
        window.history.replaceState({}, document.title, '/');
        window.location.href = '/dashboard';
      } else {
        throw new Error(data.message || 'Invalid response from server');
      }
    })
    .catch(err => {
      console.error('Google callback error:', err);
      alert(`Login failed: ${err.message}`);
      window.history.replaceState({}, document.title, '/login');
      window.location.href = '/login';
    });
  }
}
</script>
</body>
</html>
