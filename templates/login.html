<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - DropVault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ✅ CRITICAL: Fixes COOP postMessage blocking (must be FIRST meta tags) -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <link rel="stylesheet" href="/static/css/style.css">
  <!-- ✅ FIXED: Removed ALL trailing spaces (critical for script loading) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth">
  <div class="auth-container">
    <h2>Login to DropVault</h2>

    <!-- EMAIL LOGIN -->
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="auth-divider">or</div>

    <!-- ✅ GOOGLE LOGIN: AUTHORIZATION CODE FLOW (NON-NEGOTIABLE FIX) -->
    <div id="g_id_onload"
      data-client_id="100074614026-u5lmua7rt5jajqe9m0nkdfus01c1nkg6.apps.googleusercontent.com"
      data-callback="handleGoogleLogin"
      data-auto_prompt="false"
      data-type="code"          <!-- ⚠️ THIS WAS MISSING IN YOUR ACTUAL CODE -->
      data-ux_mode="popup"
      data-itp_support="true">
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="continue_with"
      data-shape="pill"
      data-logo_alignment="left">
    </div>

    <p>Don't have an account? <a href="/register">Sign up</a></p>
  </div>

<script>
// ✅ SANITIZED: Removed trailing spaces + added safety trim
const API_BASE = "https://dropvault-backend.onrender.com".trim();

/* ============================
   EMAIL LOGIN (Hardened)
============================ */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please fill in all fields");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/login/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
      credentials: "include"
    });

    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem("token", data.token);
      window.location.href = "/dashboard";
      return;
    }
    alert(data.message || "Login failed. Check credentials.");
  } catch (err) {
    console.error("Email login error:", err);
    alert("Network error. Please try again later.");
  }
});

/* ============================
   GOOGLE LOGIN: AUTH CODE FLOW (FIXES "Missing authorization code" ERROR)
============================ */
function handleGoogleLogin(response) {
  // ✅ HANDLE GOOGLE ERRORS FIRST (popup closed, denied, etc.)
  if (response.error) {
    console.warn("Google auth error:", response.error);
    const messages = {
      'popup_closed': "Authentication popup closed. Please try again.",
      'access_denied': "Google access denied. Please authorize DropVault.",
      'invalid_request': "Invalid Google auth request. Contact support."
    };
    alert(messages[response.error] || "Google login failed. Please try again.");
    return;
  }

  // ✅ CRITICAL: ONLY accept 'code' (authorization code flow)
  // Your console log proved this was missing: response contained 'credential', not 'code'
  if (!response.code) {
    console.error("❌ FATAL: Google returned ID token instead of auth code!", response);
    console.error("✅ FIX: Ensure data-type='code' is set on #g_id_onload div");
    alert("Google configuration error. Please contact support.");
    return;
  }

  // ✅ SEND AUTHORIZATION CODE TO BACKEND (NOT credential!)
  fetch(`${API_BASE}/api/auth/google/`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: response.code }), // Backend expects 'code'
    credentials: "include"
  })
  .then(async res => {
    // Robust response parsing
    const raw = await res.text();
    let data;
    try {
      data = res.headers.get('content-type')?.includes('json') 
        ? JSON.parse(raw) 
        : { error: raw };
    } catch {
      data = { error: "Invalid server response" };
    }

    if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
    if (!data.token) throw new Error("No token received from server");
    
    localStorage.setItem("token", data.token);
    window.location.href = "/dashboard";
  })
  .catch(err => {
    console.error("Google login failed:", err);
    alert(`Login failed: ${err.message}`);
  });
}
</script>
</body>
</html>
