<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - DropVault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!--  Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth">
  <div class="auth-container">
    <h2>Login to DropVault</h2>

    <!-- EMAIL LOGIN -->
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="auth-divider">or</div>

    <!-- GOOGLE LOGIN BUTTON (Custom Trigger) -->
    <!-- We use a custom button because 'g_id_signin' is for ID Tokens only -->
    <button id="googleBtn" type="button" class="google-btn">
      Continue with Google
    </button>

    <p>Don’t have an account? <a href="/register">Sign up</a></p>
  </div>

<script>
const API_BASE = "https://dropvault-backend.onrender.com";
let client;

/* ============================
   1. INITIALIZE GOOGLE CODE CLIENT
============================ */
window.onload = function() {
  client = google.accounts.oauth2.initCodeClient({
    client_id: "100074614026-u5lmua7rt5jajqe9m0nkdfus01c1nkg6.apps.googleusercontent.com",
    scope: "email profile openid", // Add 'https://www.googleapis.com/auth/drive.file' if you need DropVault file access
    ux_mode: "popup",
    callback: (response) => {
      if (response.code) {
        handleGoogleLogin(response.code);
      }
    },
  });
};

/*  2. TRIGGER LOGIN ON CLICK */
document.getElementById("googleBtn").addEventListener("click", () => {
  client.requestCode();
});

/* 3. SEND CODE TO BACKEND */
async function handleGoogleLogin(authCode) {
  try {
    console.log("Google Auth Code received:", authCode);

    const res = await fetch(`${API_BASE}/api/auth/google/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
    
      body: JSON.stringify({
        code: authCode 
      }),
      credentials: "include"
    });

    const data = await res.json();
    console.log("Backend response:", res.status, data);

    if (!res.ok) {
      alert(data.message || data.error || "Google login failed");
      return;
    }

    if (data.token) {
      localStorage.setItem("token", data.token);
      alert("Google login successful!");
      window.location.href = "/dashboard";
    }

  } catch (err) {
    console.error("Google login error:", err);
    alert("Google login failed. Check console.");
  }
}

/* EMAIL LOGIN HANDLER*/
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch(`${API_BASE}/api/login/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
      credentials: "include"
    });
    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem("token", data.token);
      window.location.href = "/dashboard";
    } else {
      alert(data.message || "Login failed");
    }
  } catch (err) { console.error(err); alert("Network error"); }
});
</script>


</body>
</html>
